<!DOCTYPE html>
<html lang="zh-Hant" data-theme="green">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級管理工作站</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');

    * {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
      box-sizing: border-box;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.2s ease;
    }

    /* 6 種色彩主題變數定義 (以淡色系為主調，兼具暗夜護眼模式) */
    :root[data-theme="green"] {
      --bg-main: #f2f8f4;
      --bg-sidebar: #ffffff;
      --bg-topbar: rgba(255, 255, 255, 0.88);
      --border-color: #dbebe0;
      --text-main: #143823;
      --text-muted: #52755f;
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-subtle: #e8f7ee;
      --active-bg: #e6f6ec;
      --active-border: #86efac;
      --icon-box-bg: #ecfbf2;
      --badge-bg: #dcfce7;
      --badge-text: #15803d;
    }

    :root[data-theme="sakura"] {
      --bg-main: #fff4f6;
      --bg-sidebar: #ffffff;
      --bg-topbar: rgba(255, 255, 255, 0.88);
      --border-color: #fbd6de;
      --text-main: #4a1d24;
      --text-muted: #88535c;
      --primary: #f43f5e;
      --primary-hover: #e11d48;
      --primary-subtle: #ffe4e9;
      --active-bg: #ffe8ec;
      --active-border: #fca5a5;
      --icon-box-bg: #fff0f3;
      --badge-bg: #ffe4e6;
      --badge-text: #be123c;
    }

    :root[data-theme="ocean"] {
      --bg-main: #f0f7fc;
      --bg-sidebar: #ffffff;
      --bg-topbar: rgba(255, 255, 255, 0.88);
      --border-color: #d2e4f3;
      --text-main: #10334e;
      --text-muted: #4e6f8a;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-subtle: #e0f2fe;
      --active-bg: #e2f0fb;
      --active-border: #7dd3fc;
      --icon-box-bg: #eff8ff;
      --badge-bg: #e0f2fe;
      --badge-text: #0369a1;
    }

    :root[data-theme="autumn"] {
      --bg-main: #fff7ed;
      --bg-sidebar: #ffffff;
      --bg-topbar: rgba(255, 255, 255, 0.88);
      --border-color: #fed7aa;
      --text-main: #431407;
      --text-muted: #83523f;
      --primary: #f97316;
      --primary-hover: #ea580c;
      --primary-subtle: #ffedd5;
      --active-bg: #ffedd5;
      --active-border: #fdba74;
      --icon-box-bg: #fff7ed;
      --badge-bg: #ffedd5;
      --badge-text: #c2410c;
    }

    :root[data-theme="purple"] {
      --bg-main: #faf5ff;
      --bg-sidebar: #ffffff;
      --bg-topbar: rgba(255, 255, 255, 0.88);
      --border-color: #eeddfc;
      --text-main: #34124e;
      --text-muted: #6f4c8d;
      --primary: #9333ea;
      --primary-hover: #7e22ce;
      --primary-subtle: #f3e8ff;
      --active-bg: #f5e8ff;
      --active-border: #d8b4fe;
      --icon-box-bg: #faf2ff;
      --badge-bg: #f3e8ff;
      --badge-text: #7e22ce;
    }

    :root[data-theme="dark"] {
      --bg-main: #0f172a;
      --bg-sidebar: #1e293b;
      --bg-topbar: rgba(30, 41, 59, 0.9);
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-subtle: #312e81;
      --active-bg: #334155;
      --active-border: #6366f1;
      --icon-box-bg: #0f172a;
      --badge-bg: #312e81;
      --badge-text: #c7d2fe;
    }

    /* 綁定主題變數套用 */
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
    }
    .theme-sidebar {
      background-color: var(--bg-sidebar);
      border-color: var(--border-color);
    }
    .theme-topbar {
      background-color: var(--bg-topbar);
      border-color: var(--border-color);
    }
    .theme-border {
      border-color: var(--border-color);
    }
    .theme-text-muted {
      color: var(--text-muted);
    }

    /* 選單按鈕與啟動樣式 */
    .nav-btn {
      color: var(--text-main);
      border-color: transparent;
    }
    .nav-btn:hover {
      background-color: var(--primary-subtle);
    }
    .nav-btn.active {
      background-color: var(--active-bg);
      border-color: var(--active-border);
      box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.04);
    }
    .nav-btn.active .nav-indicator {
      opacity: 1;
      height: 60%;
    }
    .nav-indicator {
      background-color: var(--primary);
    }
    .icon-box {
      background-color: var(--icon-box-bg);
      border: 1px solid var(--border-color);
    }
    .badge-primary {
      background-color: var(--badge-bg);
      color: var(--badge-text);
      border: 1px solid var(--border-color);
    }
    .btn-primary-action {
      background-color: var(--primary);
      color: #ffffff;
    }
    .btn-primary-action:hover {
      background-color: var(--primary-hover);
    }

    /* 滾動條美化 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="h-screen w-screen overflow-hidden flex flex-col antialiased select-none">

  <!-- 手機版頂部橫條 -->
  <header class="lg:hidden h-14 theme-topbar border-b flex items-center justify-between px-4 z-40 shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center text-white" style="background-color: var(--primary);">
        <i data-lucide="layout-grid" class="w-4.5 h-4.5"></i>
      </div>
      <span class="font-bold text-sm tracking-tight">班級管理工作站</span>
    </div>
    <button id="mobileMenuBtn" class="p-2 rounded-xl border theme-border hover:opacity-80 transition-opacity">
      <i data-lucide="menu" class="w-5 h-5"></i>
    </button>
  </header>

  <!-- 主體雙欄排版 -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- 手機版遮罩背景 -->
    <div id="mobileBackdrop" class="fixed inset-0 bg-black/40 z-40 hidden lg:hidden backdrop-blur-xs transition-opacity"></div>

    <!-- 左側選單欄 -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 theme-sidebar border-r flex flex-col justify-between transition-transform duration-300 -translate-x-full lg:translate-x-0 lg:static lg:z-auto shadow-sm">
      
      <!-- 頂部標題列 -->
      <div class="p-5 border-b theme-border shrink-0">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white shadow-sm" style="background-color: var(--primary);">
            <i data-lucide="graduation-cap" class="w-5 h-5"></i>
          </div>
          <div>
            <h1 class="font-bold text-base tracking-wide">班級管理工作站</h1>
            <p class="text-xs theme-text-muted">Classroom Portal</p>
          </div>
        </div>
      </div>

      <!-- 導航連結列表 (無多餘宣傳字眼) -->
      <nav class="p-3.5 space-y-2 flex-1 overflow-y-auto no-scrollbar">
        <div class="px-2 pt-1 pb-1 text-[11px] font-semibold theme-text-muted tracking-wider uppercase">
          系統功能清單
        </div>

        <!-- 01_absent.html -->
        <button 
          class="nav-btn active group relative w-full text-left p-3 rounded-xl border transition-all duration-200 flex items-center gap-3"
          data-url="./01_absent.html"
          data-title="01_出缺席記錄表V17-1"
          data-code="01"
        >
          <span class="nav-indicator absolute left-0 top-1/2 -translate-y-1/2 w-1.5 h-0 rounded-r opacity-0 transition-all duration-300"></span>
          <div class="icon-box w-9 h-9 rounded-lg flex items-center justify-center shrink-0">
            <i data-lucide="calendar-check" class="w-4.5 h-4.5" style="color: var(--primary)"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-semibold truncate">01_出缺席記錄表V17-1</div>
            <div class="text-[11px] theme-text-muted font-mono truncate">./01_absent.html</div>
          </div>
        </button>

        <!-- 02_performance.html -->
        <button 
          class="nav-btn group relative w-full text-left p-3 rounded-xl border transition-all duration-200 flex items-center gap-3"
          data-url="./02_performance.html"
          data-title="02_學生常規表現追蹤系統V5"
          data-code="02"
        >
          <span class="nav-indicator absolute left-0 top-1/2 -translate-y-1/2 w-1.5 h-0 rounded-r opacity-0 transition-all duration-300"></span>
          <div class="icon-box w-9 h-9 rounded-lg flex items-center justify-center shrink-0">
            <i data-lucide="award" class="w-4.5 h-4.5" style="color: var(--primary)"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-semibold truncate">02_學生常規表現追蹤系統V5</div>
            <div class="text-[11px] theme-text-muted font-mono truncate">./02_performance.html</div>
          </div>
        </button>

        <!-- 03_Homework.html -->
        <button 
          class="nav-btn group relative w-full text-left p-3 rounded-xl border transition-all duration-200 flex items-center gap-3"
          data-url="./03_Homework.html"
          data-title="03_作業催繳系統V8"
          data-code="03"
        >
          <span class="nav-indicator absolute left-0 top-1/2 -translate-y-1/2 w-1.5 h-0 rounded-r opacity-0 transition-all duration-300"></span>
          <div class="icon-box w-9 h-9 rounded-lg flex items-center justify-center shrink-0">
            <i data-lucide="clipboard-list" class="w-4.5 h-4.5" style="color: var(--primary)"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-semibold truncate">03_作業催繳系統V8</div>
            <div class="text-[11px] theme-text-muted font-mono truncate">./03_Homework.html</div>
          </div>
        </button>

        <!-- 04_ContactBook.html -->
        <button 
          class="nav-btn group relative w-full text-left p-3 rounded-xl border transition-all duration-200 flex items-center gap-3"
          data-url="./04_ContactBook.html"
          data-title="04_聯絡簿系統V9"
          data-code="04"
        >
          <span class="nav-indicator absolute left-0 top-1/2 -translate-y-1/2 w-1.5 h-0 rounded-r opacity-0 transition-all duration-300"></span>
          <div class="icon-box w-9 h-9 rounded-lg flex items-center justify-center shrink-0">
            <i data-lucide="book-open" class="w-4.5 h-4.5" style="color: var(--primary)"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-semibold truncate">04_聯絡簿系統V9</div>
            <div class="text-[11px] theme-text-muted font-mono truncate">./04_ContactBook.html</div>
          </div>
        </button>
      </nav>

      <!-- 側邊欄底部工具區 -->
      <div class="p-4 border-t theme-border shrink-0 space-y-3">
        <!-- 一鍵下載原始 index.html -->
        <button 
          id="downloadSelfBtn" 
          class="btn-primary-action w-full flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl text-xs font-semibold shadow-sm transition-all active:scale-[0.98]"
        >
          <i data-lucide="download" class="w-3.5 h-3.5"></i>
          <span>下載 index.html 檔</span>
        </button>

        <div class="flex items-center justify-between text-[11px] theme-text-muted font-mono px-1">
          <span>路徑：同資料夾相對路徑</span>
          <span class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full" style="background-color: var(--primary);"></span>
            運作中
          </span>
        </div>
      </div>
    </aside>

    <!-- 右側主要工作區域 (Top Bar + iframe) -->
    <main class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
      
      <!-- 頂部狀態橫列與主題色彩切換選單 -->
      <div class="h-14 theme-topbar border-b flex items-center justify-between px-4 sm:px-6 shrink-0 z-20 shadow-xs">
        
        <!-- 當前載入名稱與編號 -->
        <div class="flex items-center gap-2.5 sm:gap-3 min-w-0">
          <span id="activeBadge" class="badge-primary px-2 py-0.5 rounded-lg text-xs font-mono font-semibold">
            01
          </span>
          <h2 id="currentPageTitle" class="text-sm sm:text-base font-bold truncate">
            01_出缺席記錄表V17-1
          </h2>
          <!-- 載入指示動畫 -->
          <div id="loadingIndicator" class="flex items-center gap-1.5 text-xs transition-opacity duration-200" style="color: var(--primary);">
            <i data-lucide="loader" class="w-3.5 h-3.5 animate-spin"></i>
            <span class="hidden md:inline text-[11px] theme-text-muted">載入中...</span>
          </div>
        </div>

        <!-- 右側操作：色彩選擇器、重新載入、新分頁 -->
        <div class="flex items-center gap-2 shrink-0">
          
          <!-- 六色淡色系主題切換選單 (下拉式選單) -->
          <div class="relative">
            <button 
              id="themeDropdownBtn" 
              class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border theme-border hover:opacity-85 text-xs font-medium transition-all"
              title="選擇色彩風格"
            >
              <span id="currentThemeDot" class="w-3 h-3 rounded-full" style="background-color: var(--primary);"></span>
              <span id="currentThemeName" class="hidden sm:inline">原綠色</span>
              <i data-lucide="chevron-down" class="w-3.5 h-3.5 theme-text-muted"></i>
            </button>

            <!-- 顏色選單下拉彈窗 -->
            <div 
              id="themeMenu" 
              class="hidden absolute right-0 mt-2 w-44 rounded-2xl theme-sidebar border theme-border shadow-lg py-1.5 z-50 text-xs"
            >
              <div class="px-3 py-1 text-[10px] font-semibold theme-text-muted uppercase tracking-wider">
                淡色系風格切換
              </div>

              <!-- 1. 原綠色 -->
              <button class="theme-option w-full flex items-center gap-2.5 px-3 py-2 text-left hover:bg-slate-100/60 dark:hover:bg-slate-800/60 transition-colors" data-theme-id="green" data-theme-name="原綠色">
                <span class="w-3.5 h-3.5 rounded-full bg-emerald-500 shrink-0 border border-emerald-600/20"></span>
                <span class="flex-1 font-medium">原綠色</span>
              </button>

              <!-- 2. 櫻花粉紅色 -->
              <button class="theme-option w-full flex items-center gap-2.5 px-3 py-2 text-left hover:bg-slate-100/60 dark:hover:bg-slate-800/60 transition-colors" data-theme-id="sakura" data-theme-name="櫻花粉紅色">
                <span class="w-3.5 h-3.5 rounded-full bg-rose-400 shrink-0 border border-rose-500/20"></span>
                <span class="flex-1 font-medium">櫻花粉紅色</span>
              </button>

              <!-- 3. 深海湛藍 -->
              <button class="theme-option w-full flex items-center gap-2.5 px-3 py-2 text-left hover:bg-slate-100/60 dark:hover:bg-slate-800/60 transition-colors" data-theme-id="ocean" data-theme-name="深海湛藍">
                <span class="w-3.5 h-3.5 rounded-full bg-sky-500 shrink-0 border border-sky-600/20"></span>
                <span class="flex-1 font-medium">深海湛藍</span>
              </button>

              <!-- 4. 秋意濃橘 -->
              <button class="theme-option w-full flex items-center gap-2.5 px-3 py-2 text-left hover:bg-slate-100/60 dark:hover:bg-slate-800/60 transition-colors" data-theme-id="autumn" data-theme-name="秋意濃橘">
                <span class="w-3.5 h-3.5 rounded-full bg-orange-400 shrink-0 border border-orange-500/20"></span>
                <span class="flex-1 font-medium">秋意濃橘</span>
              </button>

              <!-- 5. 星空幻紫 -->
              <button class="theme-option w-full flex items-center gap-2.5 px-3 py-2 text-left hover:bg-slate-100/60 dark:hover:bg-slate-800/60 transition-colors" data-theme-id="purple" data-theme-name="星空幻紫">
                <span class="w-3.5 h-3.5 rounded-full bg-purple-500 shrink-0 border border-purple-600/20"></span>
                <span class="flex-1 font-medium">星空幻紫</span>
              </button>

              <div class="my-1 border-t theme-border"></div>

              <!-- 6. 暗夜護眼 -->
              <button class="theme-option w-full flex items-center gap-2.5 px-3 py-2 text-left hover:bg-slate-100/60 dark:hover:bg-slate-800/60 transition-colors" data-theme-id="dark" data-theme-name="暗夜護眼">
                <span class="w-3.5 h-3.5 rounded-full bg-slate-700 shrink-0 border border-slate-600"></span>
                <span class="flex-1 font-medium">暗夜護眼</span>
              </button>
            </div>
          </div>

          <!-- 重新整理當前 iframe 按鈕 -->
          <button 
            id="refreshFrameBtn" 
            title="重新整理當前頁面" 
            class="p-2 rounded-xl border theme-border hover:opacity-80 transition-opacity"
          >
            <i data-lucide="rotate-cw" class="w-4 h-4"></i>
          </button>

          <!-- 在新分頁打開按鈕 -->
          <a 
            id="openExternalLink" 
            href="./01_absent.html" 
            target="_blank" 
            rel="noopener noreferrer" 
            title="在新分頁打開" 
            class="flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-xl border theme-border hover:opacity-80 text-xs font-medium transition-opacity"
          >
            <span class="hidden sm:inline">新分頁打開</span>
            <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
          </a>
        </div>
      </div>

      <!-- 右側內容內嵌視窗 (iframe) -->
      <div class="flex-1 w-full h-full relative">
        <iframe 
          id="mainFrame" 
          src="./01_absent.html" 
          class="w-full h-full border-0 bg-white"
          title="班級管理系統畫面"
        ></iframe>
      </div>

    </main>

  </div>

  <script>
    // 初始化 Lucide 圖示
    lucide.createIcons();

    // DOM 元素引用
    const navButtons = document.querySelectorAll('.nav-btn');
    const mainFrame = document.getElementById('mainFrame');
    const currentPageTitle = document.getElementById('currentPageTitle');
    const activeBadge = document.getElementById('activeBadge');
    const openExternalLink = document.getElementById('openExternalLink');
    const refreshFrameBtn = document.getElementById('refreshFrameBtn');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const downloadSelfBtn = document.getElementById('downloadSelfBtn');

    // 主題切換相關
    const themeDropdownBtn = document.getElementById('themeDropdownBtn');
    const themeMenu = document.getElementById('themeMenu');
    const themeOptions = document.querySelectorAll('.theme-option');
    const currentThemeName = document.getElementById('currentThemeName');
    const currentThemeDot = document.getElementById('currentThemeDot');

    // 行動版側邊欄
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.getElementById('sidebar');
    const mobileBackdrop = document.getElementById('mobileBackdrop');

    // 1. 主題切換與 localStorage 記憶
    function applyTheme(themeId, themeName) {
      document.documentElement.setAttribute('data-theme', themeId);
      localStorage.setItem('preferred-classroom-theme', themeId);
      localStorage.setItem('preferred-classroom-theme-name', themeName);
      currentThemeName.textContent = themeName;
      // 根據主題改變點點顏色
      const colorMap = {
        green: '#10b981',
        sakura: '#f43f5e',
        ocean: '#0284c7',
        autumn: '#f97316',
        purple: '#9333ea',
        dark: '#6366f1'
      };
      currentThemeDot.style.backgroundColor = colorMap[themeId] || '#10b981';
      lucide.createIcons();
    }

    // 載入儲存的配色偏好 (預設原綠色)
    const savedTheme = localStorage.getItem('preferred-classroom-theme') || 'green';
    const savedThemeName = localStorage.getItem('preferred-classroom-theme-name') || '原綠色';
    applyTheme(savedTheme, savedThemeName);

    // 下拉選單開關
    themeDropdownBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      themeMenu.classList.toggle('hidden');
    });

    // 點擊外部關閉選單
    document.addEventListener('click', () => {
      if (!themeMenu.classList.contains('hidden')) {
        themeMenu.classList.add('hidden');
      }
    });

    // 選取主題
    themeOptions.forEach(opt => {
      opt.addEventListener('click', () => {
        const id = opt.getAttribute('data-theme-id');
        const name = opt.getAttribute('data-theme-name');
        applyTheme(id, name);
        themeMenu.classList.add('hidden');
      });
    });

    // 2. 側邊欄抽屜開關 (手機版 RWD)
    function closeSidebarMobile() {
      sidebar.classList.add('-translate-x-full');
      mobileBackdrop.classList.add('hidden');
    }

    mobileMenuBtn.addEventListener('click', () => {
      sidebar.classList.toggle('-translate-x-full');
      mobileBackdrop.classList.toggle('hidden');
    });

    mobileBackdrop.addEventListener('click', closeSidebarMobile);

    // 3. 左側點擊切換右側 iframe
    navButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const url = btn.getAttribute('data-url');
        const title = btn.getAttribute('data-title');
        const code = btn.getAttribute('data-code');

        navButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        currentPageTitle.textContent = title;
        activeBadge.textContent = code;
        openExternalLink.href = url;

        loadingIndicator.classList.remove('opacity-0');
        mainFrame.src = url;

        closeSidebarMobile();
      });
    });

    // iframe 載入完成通知
    mainFrame.addEventListener('load', () => {
      loadingIndicator.classList.add('opacity-0');
    });

    // 重新載入當前 iframe
    refreshFrameBtn.addEventListener('click', () => {
      loadingIndicator.classList.remove('opacity-0');
      mainFrame.contentWindow.location.reload();
    });

    // 4. 一鍵下載乾淨的 index.html 檔
    downloadSelfBtn.addEventListener('click', () => {
      try {
        const htmlDoc = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
        const blob = new Blob([htmlDoc], { type: 'text/html;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'index.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
      } catch (e) {
        console.error('下載失敗', e);
      }
    });
  </script>

</body>
</html>
