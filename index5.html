<!DOCTYPE html>
<html lang="zh-Hant" data-theme="theme-green">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教學行政管理整合系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ========================================================
       色彩系統（6 種淡色系主題）
       ======================================================== */
    :root, [data-theme="theme-green"] {
      --bg-main: #f4f9f6;
      --bg-sidebar: #ffffff;
      --bg-card: #ffffff;
      --text-main: #1b382b;
      --text-muted: #5e796c;
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-light: #ecfdf5;
      --primary-border: #a7f3d0;
      --border-color: #e2ede7;
      --shadow-sm: 0 1px 3px rgba(16, 185, 129, 0.06);
      --shadow-md: 0 4px 12px rgba(16, 185, 129, 0.08);
      --topbar-bg: rgba(255, 255, 255, 0.92);
    }

    [data-theme="theme-pink"] {
      --bg-main: #fff5f7;
      --bg-sidebar: #ffffff;
      --bg-card: #ffffff;
      --text-main: #4a202a;
      --text-muted: #8c606a;
      --primary: #f472b6;
      --primary-hover: #ec4899;
      --primary-light: #fdf2f8;
      --primary-border: #fbcfe8;
      --border-color: #fae0e7;
      --shadow-sm: 0 1px 3px rgba(244, 114, 182, 0.08);
      --shadow-md: 0 4px 12px rgba(244, 114, 182, 0.1);
      --topbar-bg: rgba(255, 255, 255, 0.92);
    }

    [data-theme="theme-blue"] {
      --bg-main: #f0f7ff;
      --bg-sidebar: #ffffff;
      --bg-card: #ffffff;
      --text-main: #142a42;
      --text-muted: #536f8f;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --primary-light: #f0f9ff;
      --primary-border: #bae6fd;
      --border-color: #dceaf7;
      --shadow-sm: 0 1px 3px rgba(56, 189, 248, 0.08);
      --shadow-md: 0 4px 12px rgba(56, 189, 248, 0.1);
      --topbar-bg: rgba(255, 255, 255, 0.92);
    }

    [data-theme="theme-orange"] {
      --bg-main: #fff8f1;
      --bg-sidebar: #ffffff;
      --bg-card: #ffffff;
      --text-main: #442611;
      --text-muted: #856147;
      --primary: #fb923c;
      --primary-hover: #ea580c;
      --primary-light: #fff7ed;
      --primary-border: #fed7aa;
      --border-color: #fae6d4;
      --shadow-sm: 0 1px 3px rgba(251, 146, 60, 0.08);
      --shadow-md: 0 4px 12px rgba(251, 146, 60, 0.1);
      --topbar-bg: rgba(255, 255, 255, 0.92);
    }

    [data-theme="theme-purple"] {
      --bg-main: #faf5ff;
      --bg-sidebar: #ffffff;
      --bg-card: #ffffff;
      --text-main: #331d47;
      --text-muted: #6e5585;
      --primary: #c084fc;
      --primary-hover: #9333ea;
      --primary-light: #faf5ff;
      --primary-border: #e9d5ff;
      --border-color: #ede2f7;
      --shadow-sm: 0 1px 3px rgba(192, 132, 252, 0.08);
      --shadow-md: 0 4px 12px rgba(192, 132, 252, 0.1);
      --topbar-bg: rgba(255, 255, 255, 0.92);
    }

    [data-theme="theme-dark"] {
      --bg-main: #14171a;
      --bg-sidebar: #1d2126;
      --bg-card: #252a30;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #7dd3fc;
      --primary-light: #1e293b;
      --primary-border: #334155;
      --border-color: #2c3239;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
      --topbar-bg: rgba(29, 33, 38, 0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* ========================================================
       左側側邊欄（支援平滑收縮展開）
       ======================================================== */
    .sidebar {
      width: 320px;
      height: 100vh;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                  margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                  border-color 0.25s ease,
                  background-color 0.25s ease;
      z-index: 30;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }

    /* 桌面版收合狀態 */
    body.sidebar-collapsed .sidebar {
      width: 0;
      margin-left: 0;
      border-right: none;
    }

    .brand-section {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 320px;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      color: var(--primary-hover);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* 側欄內部收合按鈕 */
    .btn-collapse-sidebar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-collapse-sidebar:hover {
      background: var(--primary-light);
      color: var(--primary-hover);
      border-color: var(--primary-border);
    }

    /* 功能網頁選單 */
    .nav-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 320px;
    }

    .nav-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 4px 10px 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--text-main);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.18s ease;
      position: relative;
    }

    .nav-item:hover {
      background: var(--primary-light);
      color: var(--primary-hover);
    }

    .nav-item.active {
      background: var(--primary-light);
      border-color: var(--primary-border);
      color: var(--primary-hover);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .nav-item.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 25%;
      bottom: 25%;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: var(--primary);
    }

    .nav-num {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: all 0.18s ease;
    }

    .nav-item.active .nav-num {
      background: var(--primary);
      color: #ffffff;
    }

    .nav-item-title {
      font-size: 0.92rem;
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 側欄底部：顏色主題選擇區 */
    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border-color);
      background: var(--bg-sidebar);
      min-width: 320px;
    }

    .theme-header {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .theme-header-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-header-hint {
      font-size: 0.7rem;
      color: var(--text-muted);
      opacity: 0.8;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .theme-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s ease;
      justify-content: flex-start;
    }

    .theme-btn:hover {
      border-color: var(--primary-border);
      background: var(--primary-light);
    }

    .theme-btn.active {
      border-color: var(--primary);
      background: var(--primary-light);
      font-weight: 700;
      color: var(--primary-hover);
    }

    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ========================================================
       右側展示工作區
       ======================================================== */
    .main-workspace {
      flex: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-main);
      overflow: hidden;
      min-width: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .workspace-topbar {
      height: 60px;
      background: var(--topbar-bg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      gap: 12px;
    }

    .current-page-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    /* 頂部常駐收合/展開側欄按鈕 */
    .btn-toggle-sidebar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 9px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-toggle-sidebar:hover {
      border-color: var(--primary-border);
      background: var(--primary-light);
      color: var(--primary-hover);
    }

    .badge-num {
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      color: var(--primary-hover);
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .current-title {
      font-size: 1.05rem;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.82rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-action:hover {
      border-color: var(--primary-border);
      background: var(--primary-light);
      color: var(--primary-hover);
    }

    .iframe-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: var(--bg-sidebar);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* 手機與平板窄螢幕樣式 */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 25;
      backdrop-filter: blur(2px);
    }

    @media (max-width: 860px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        margin-left: -320px;
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.18);
      }
      body.mobile-sidebar-open .sidebar {
        margin-left: 0;
      }
      body.mobile-sidebar-open .sidebar-overlay {
        display: block;
      }
      body.sidebar-collapsed .sidebar {
        width: 320px;
        margin-left: -320px;
      }
    }
  </style>
</head>
<body>

  <!-- 手機版背景遮罩 -->
  <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

  <!-- 左側導覽側邊欄 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand-section">
      <div class="brand-left">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>教學行政系統</h1>
          <p>班級管理與學習追蹤入口</p>
        </div>
      </div>
      <!-- 側欄收合按鈕 -->
      <button class="btn-collapse-sidebar" onclick="toggleSidebar()" title="收合選單 (Ctrl+B 或 [ 鍵)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
          <path d="m14 9-3 3 3 3"/>
        </svg>
      </button>
    </div>

    <!-- 網頁切換清單 -->
    <nav class="nav-container">
      <div class="nav-label">功能清單</div>

      <div class="nav-item active" onclick="switchPage('./01_absent.html', '01_出缺席記錄表V17-1', '01', this)">
        <span class="nav-num">01</span>
        <span class="nav-item-title">01_出缺席記錄表V17-1</span>
      </div>

      <div class="nav-item" onclick="switchPage('./02_performance.html', '02_學生常規表現追蹤系統V5', '02', this)">
        <span class="nav-num">02</span>
        <span class="nav-item-title">02_學生常規表現追蹤系統V5</span>
      </div>

      <div class="nav-item" onclick="switchPage('./03_Homework.html', '03_作業催繳系統V8', '03', this)">
        <span class="nav-num">03</span>
        <span class="nav-item-title">03_作業催繳系統V8</span>
      </div>

      <div class="nav-item" onclick="switchPage('./04_ContactBook.html', '04_聯絡簿系統V9', '04', this)">
        <span class="nav-num">04</span>
        <span class="nav-item-title">04_聯絡簿系統V9</span>
      </div>
    </nav>

    <!-- 側欄底部：顏色主題選擇區 -->
    <div class="sidebar-footer">
      <div class="theme-header">
        <div class="theme-header-left">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="m4.93 4.93 4.24 4.24"/>
            <path d="m14.83 9.17 4.24-4.24"/>
            <path d="m14.83 14.83 4.24 4.24"/>
            <path d="m9.17 14.83-4.24 4.24"/>
          </svg>
          <span>介面主題色</span>
        </div>
        <span class="theme-header-hint">淡色系</span>
      </div>
      <div class="theme-grid">
        <button type="button" class="theme-btn active" data-theme-target="theme-green" onclick="setTheme('theme-green', this)">
          <span class="color-dot" style="background: #10b981;"></span> 原綠色
        </button>
        <button type="button" class="theme-btn" data-theme-target="theme-pink" onclick="setTheme('theme-pink', this)">
          <span class="color-dot" style="background: #f472b6;"></span> 櫻花粉
        </button>
        <button type="button" class="theme-btn" data-theme-target="theme-blue" onclick="setTheme('theme-blue', this)">
          <span class="color-dot" style="background: #38bdf8;"></span> 湛藍
        </button>
        <button type="button" class="theme-btn" data-theme-target="theme-orange" onclick="setTheme('theme-orange', this)">
          <span class="color-dot" style="background: #fb923c;"></span> 秋意橘
        </button>
        <button type="button" class="theme-btn" data-theme-target="theme-purple" onclick="setTheme('theme-purple', this)">
          <span class="color-dot" style="background: #c084fc;"></span> 幻紫
        </button>
        <button type="button" class="theme-btn" data-theme-target="theme-dark" onclick="setTheme('theme-dark', this)">
          <span class="color-dot" style="background: #334155;"></span> 暗夜
        </button>
      </div>
    </div>
  </aside>

  <!-- 右側工作展示區 -->
  <main class="main-workspace">
    <header class="workspace-topbar">
      <div class="current-page-info">
        <!-- 展開 / 收合側欄按鈕 -->
        <button class="btn-toggle-sidebar" id="sidebarToggleBtn" onclick="toggleSidebar()" title="展開/收合側邊欄 (Ctrl+B 或 [ 鍵)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>

        <span class="badge-num" id="currentNum">01</span>
        <span class="current-title" id="currentTitle">01_出缺席記錄表V17-1</span>
      </div>

      <div class="topbar-actions">
        <!-- 重新載入當前 iframe -->
        <button class="btn-action" onclick="reloadFrame()" title="重新整理當前頁面">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 16H3v5"/>
          </svg>
          重新載入
        </button>

        <!-- 在新分頁開啟該頁面 -->
        <a id="openNewTabBtn" href="./01_absent.html" target="_blank" class="btn-action" title="在新分頁開啟">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
          新分頁開啟
        </a>
      </div>
    </header>

    <!-- 內嵌內容區 -->
    <div class="iframe-wrapper">
      <iframe id="mainFrame" src="./01_absent.html" title="工作區頁面"></iframe>
    </div>
  </main>

  <script>
    // 頁面切換控制
    function switchPage(url, title, num, elem) {
      document.getElementById('mainFrame').src = url;
      document.getElementById('currentTitle').textContent = title;
      document.getElementById('currentNum').textContent = num;
      document.getElementById('openNewTabBtn').href = url;

      // 切換選單選取狀態
      const items = document.querySelectorAll('.nav-item');
      items.forEach(item => item.classList.remove('active'));
      if (elem) {
        elem.classList.add('active');
      }

      // 手機版點選後自動收回選單
      if (window.innerWidth <= 860) {
        document.body.classList.remove('mobile-sidebar-open');
      }
    }

    // 重新整理當前 iframe
    function reloadFrame() {
      const frame = document.getElementById('mainFrame');
      frame.src = frame.src;
    }

    // 側邊欄展開 / 收合控制
    function toggleSidebar() {
      if (window.innerWidth <= 860) {
        // 手機/窄螢幕模式
        document.body.classList.toggle('mobile-sidebar-open');
      } else {
        // 桌面大螢幕模式
        const isCollapsed = document.body.classList.toggle('sidebar-collapsed');
        localStorage.setItem('sidebar-collapsed', isCollapsed ? 'true' : 'false');
      }
    }

    // 鍵盤快捷鍵：Ctrl + B 或 [ 快速切換側邊欄
    window.addEventListener('keydown', (e) => {
      // 避免在輸入文字時觸發
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if ((e.ctrlKey && e.key.toLowerCase() === 'b') || e.key === '[') {
        e.preventDefault();
        toggleSidebar();
      }
    });

    // 顏色主題切換與記憶
    function setTheme(themeName, btnElem) {
      document.documentElement.setAttribute('data-theme', themeName);
      localStorage.setItem('user-color-theme', themeName);

      // 更新按鈕 active 樣式
      document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElem) {
        btnElem.classList.add('active');
      }
    }

    // 頁面載入初始化
    window.addEventListener('DOMContentLoaded', () => {
      // 1. 讀取主題偏好
      const savedTheme = localStorage.getItem('user-color-theme') || 'theme-green';
      document.documentElement.setAttribute('data-theme', savedTheme);
      
      const targetBtn = document.querySelector(`.theme-btn[data-theme-target="${savedTheme}"]`);
      if (targetBtn) {
        document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
        targetBtn.classList.add('active');
      }

      // 2. 讀取側邊欄收合狀態（僅在寬螢幕上記錄）
      if (window.innerWidth > 860) {
        const isCollapsed = localStorage.getItem('sidebar-collapsed') === 'true';
        if (isCollapsed) {
          document.body.classList.add('sidebar-collapsed');
        }
      }
    });
  </script>
</body>
</html>
